name: External validity audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e '.[demo,dev]' -r benchmarks/requirements.txt
      - run: python benchmarks/fetch.py --data-dir reports/audit-data
      - run: python benchmarks/run.py --data-dir reports/audit-data --out reports/validation
      - run: python benchmarks/incremental.py --data-dir reports/audit-data --out reports/validation
      - run: npm install --prefix reports/promptfoo-runtime --no-audit --no-fund promptfoo@0.125.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: python benchmarks/promptfoo_compare.py --data-dir reports/audit-data --runtime reports/promptfoo-runtime --out reports/validation
      - uses: actions/upload-artifact@v4
        with:
          name: external-validity-report
          path: reports/validation/
