name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[demo,dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: rag-changelab demo --out reports/demo
      - run: python experiments/scheduler_audit.py --out reports/scheduler-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: demo-python-${{ matrix.python }}
          path: reports/
